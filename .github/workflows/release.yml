name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  COMPOSE_WEBVIEW_REPO: KRTirtho/ComposeNativeWebview
  COMPOSE_WEBVIEW_COMMIT: b11ac748de1219f9432338c067a2c5dafef3072a

jobs:
  build-webview-natives:
    name: WebView Natives (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
          - name: linux-aarch64
            os: ubuntu-24.04-arm
          - name: windows-x64
            os: windows-latest
    steps:
      - name: Checkout ComposeNativeWebview
        uses: actions/checkout@v7
        with:
          repository: ${{ env.COMPOSE_WEBVIEW_REPO }}
          ref: ${{ env.COMPOSE_WEBVIEW_COMMIT }}
          token: ${{ secrets.GITHUB_TOKEN }}
          path: compose-webview

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Build Linux WebView native library
        if: runner.os == 'Linux'
        working-directory: compose-webview
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libcairo2-dev \
            libsoup-3.0-dev libwebkit2gtk-4.1-dev
          bash webview-compose/src/jvmMain/native/linux/build.sh

      - name: Build Windows WebView native library
        if: runner.os == 'Windows'
        working-directory: compose-webview
        shell: cmd
        run: webview-compose\src\jvmMain\native\windows\build.bat

      - name: Verify WebView native library
        working-directory: compose-webview
        shell: bash
        run: |
          case "${{ matrix.name }}" in
            linux-*)     files="${{ matrix.name }}/libcompose_webview_linux.so" ;;
            windows-x64) files="win32-x64/compose_webview_windows.dll win32-x64/WebView2Loader.dll" ;;
          esac
          for f in $files; do
            test -f "webview-compose/src/jvmMain/resources/nucleus/native/$f" || { echo "::error::Missing $f"; exit 1; }
          done

      - name: Upload WebView native library
        uses: actions/upload-artifact@v7
        with:
          name: webview-natives-${{ matrix.name }}
          path: compose-webview/webview-compose/src/jvmMain/resources/nucleus/native/
          retention-days: 1

  prepare-deps:
    name: Prepare Dependencies
    needs: build-webview-natives
    runs-on: macos-13
    steps:
      - name: Checkout ComposeNativeWebview
        uses: actions/checkout@v7
        with:
          repository: ${{ env.COMPOSE_WEBVIEW_REPO }}
          ref: ${{ env.COMPOSE_WEBVIEW_COMMIT }}
          token: ${{ secrets.GITHUB_TOKEN }}
          path: compose-webview

      - name: Download WebView native libraries
        uses: actions/download-artifact@v8
        with:
          pattern: webview-natives-*
          merge-multiple: true
          path: compose-webview/webview-compose/src/jvmMain/resources/nucleus/native

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Publish compose-webview to mavenLocal
        working-directory: compose-webview
        run: |
          chmod +x gradlew
          ./gradlew publishToMavenLocal

      - name: Verify published JVM jar carries every WebView backend
        run: |
          jar=$(ls ~/.m2/repository/dev/nucleusframework/composewebview-jvm/*/composewebview-jvm-*.jar | grep -v -e sources -e javadoc | head -1)
          contents=$(unzip -l "$jar")
          for f in linux-x64/libcompose_webview_linux.so linux-aarch64/libcompose_webview_linux.so \
                   win32-x64/compose_webview_windows.dll win32-x64/WebView2Loader.dll \
                   darwin-aarch64/libcompose_webview_macos.dylib darwin-x64/libcompose_webview_macos.dylib; do
            grep -q "nucleus/native/$f" <<<"$contents" || { echo "::error::$jar is missing $f"; exit 1; }
          done

      - name: Upload maven local
        uses: actions/upload-artifact@v7
        with:
          name: maven-local
          path: ~/.m2/repository/

  build-android:
    name: Android
    needs: prepare-deps
    timeout-minutes: 120
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download maven local
        uses: actions/download-artifact@v8
        with:
          name: maven-local
          path: ~/.m2/repository/

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v -keystore composeApp/upload-keystore.jks \
            -alias universalmusic -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass universalmusic2026 -keypass universalmusic2026 \
            -dname "CN=Universal Music, OU=Apps, O=yashhasan570, L=Dhaka, ST=Dhaka, C=BD"

      - name: Configure Android signing
        working-directory: composeApp
        run: |
          cat >> local.properties <<EOF
          release.signing.storeFile=${{ github.workspace }}/composeApp/upload-keystore.jks
          release.signing.storePassword=universalmusic2026
          release.signing.keyAlias=universalmusic
          release.signing.keyPassword=universalmusic2026
          EOF

      - name: Assemble Release
        run: ./gradlew :composeApp:assembleStableRelease

      - name: Rename APK
        run: |
          APK_FILE=$(find composeApp/build/outputs/apk -path "*elease*" -name "*.apk" -type f | head -1)
          cp "$APK_FILE" UniversalMusic-android-all-arch.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: UniversalMusic-android-all-arch.apk

  build-windows:
    name: Windows Desktop
    needs: prepare-deps
    timeout-minutes: 120
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download maven local
        uses: actions/download-artifact@v8
        with:
          name: maven-local
          path: ~/.m2/repository/

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # native-image links with MSVC
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache GraalVM toolchain
        uses: actions/cache@v6
        with:
          path: ~/.gradle/nucleus/graalvm
          key: graalvm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml', 'composeApp/build.gradle.kts') }}
          restore-keys: graalvm-${{ runner.os }}-${{ runner.arch }}-

      - name: Package EXE
        env:
          # Nucleus lists GraalVM CE releases via the GitHub API; unauthenticated calls hit the 60/hour limit
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :composeApp:packageGraalvmExe

      - name: Rename Windows artifacts
        shell: pwsh
        run: |
          $EXE_FILE = Get-ChildItem -Path composeApp/build/compose/binaries/main/graalvm-exe -Filter "*.exe" |
            Where-Object { $_.Name -notlike '__*' } | Select-Object -First 1
          Copy-Item $EXE_FILE.FullName UniversalMusic-windows-x86_64-setup.exe

      - name: Upload EXE
        uses: actions/upload-artifact@v7
        with:
          name: windows-exe
          path: UniversalMusic-windows-x86_64-setup.exe

  publish:
    name: Publish release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Read version
        run: |
          VERSION=$(./gradlew -q :composeApp:printVersion | tail -1)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: '{android-apk,windows-exe}'

      - name: Rename assets and checksums
        run: |
          mkdir out
          cp android-apk/UniversalMusic-android-all-arch.apk "out/UniversalMusic-${VERSION}-android-all-arch.apk"
          cp windows-exe/UniversalMusic-windows-x86_64-setup.exe "out/UniversalMusic-${VERSION}-windows-x86_64-setup.exe"
          cd out
          sha256sum * > SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes || true
          git push origin :refs/tags/latest || true
          gh release create latest \
            --title "Universal Music v${VERSION}" \
            --notes "Windows installer and Android APK (all architectures), with SHA256 checksums." \
            out/*
